services:
  frontend:
    image: nginx:alpine
    container_name: portfolio_frontend

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - portfolio_network

  backend:
    build:
      context: ./backend

    container_name: portfolio_backend

    restart: unless-stopped

    expose:
      - "8000"

    environment:
      - PYTHONUNBUFFERED=1

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000

    networks:
      - portfolio_network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  portfolio_network:
